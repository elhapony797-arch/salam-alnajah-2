<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلم النجاح</title>
<style>
:root{--bg:#0f1b3d;--card:#1a2a5c;--gold:#f5b942;--mut:#9fb0d9}
*{box-sizing:border-box;margin:0;font-family:Tahoma,Arial,sans-serif}
body{background:var(--bg);color:#fff;padding-bottom:70px}
header{padding:20px;text-align:center;background:#1a2a5c;border-bottom:3px solid var(--gold)}
header h1{color:var(--gold);font-size:22px}
header p{color:var(--mut);font-size:13px;margin-top:4px}
main{padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.stat{text-align:center;color:var(--mut)}
.stat b{font-size:30px;color:var(--gold);display:block}
input{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:none;font-size:15px}
button{padding:11px;border-radius:10px;border:none;font-size:15px;background:var(--gold);color:#000;font-weight:bold}
.full{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2c3f7a;gap:8px}
.del{background:#e5484d;color:#fff;padding:5px 10px;font-size:13px}
.ok{background:#2ecc71}.no{background:#e5484d;color:#fff}
nav{position:fixed;bottom:0;right:0;left:0;display:flex;background:#0a1330;border-top:1px solid var(--gold)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:12px;padding:13px 2px}
nav button.on{color:var(--gold)}
.sec{display:none}.sec.on{display:block}
</style>
</head>
<body>
<header><h1>🪜 سلم النجاح</h1><p>نظام إدارة المدرسة الذكية</p></header>
<main>
<div id="home" class="sec on">
  <div class="grid">
    <div class="card stat"><b id="cs">0</b>الطلاب</div>
    <div class="card stat"><b id="ct">0</b>المعلمون</div>
    <div class="card stat"><b id="cp">0</b>الحضور اليوم</div>
    <div class="card stat"><b id="cf">0</b>الرسوم المدفوعة</div>
  </div>
  <div class="card"><div style="color:var(--mut);font-size:13px">نسبة الحضور</div>
  <div style="background:#0a1330;border-radius:10px;height:14px;margin-top:8px"><div id="bar" style="background:var(--gold);height:14px;border-radius:10px;width:0"></div></div></div>
</div>

<div id="stu" class="sec">
  <div class="card"><input id="sn" placeholder="اسم الطالب"><input id="sc" placeholder="الصف"><button class="full" onclick="addS()">➕ إضافة طالب</button></div>
  <div class="card" id="ls"></div>
</div>

<div id="tea" class="sec">
  <div class="card"><input id="tn" placeholder="اسم المعلم"><input id="tm" placeholder="المادة"><button class="full" onclick="addT()">➕ إضافة معلم</button></div>
  <div class="card" id="lt"></div>
</div>

<div id="att" class="sec"><div class="card" id="la"></div></div>

<div id="fee" class="sec">
  <div class="card"><input id="fn" placeholder="اسم الطالب"><input id="fa" type="number" placeholder="المبلغ"><button class="full" onclick="addF()">➕ إضافة رسوم</button></div>
  <div class="card" id="lf"></div>
</div>
</main>

<nav>
<button class="on" onclick="show('home',this)">🏠<br>الرئيسية</button>
<button onclick="show('stu',this)">🎓<br>الطلاب</button>
<button onclick="show('tea',this)">👨‍🏫<br>المعلمون</button>
<button onclick="show('att',this)">✅<br>الحضور</button>
<button onclick="show('fee',this)">💰<br>الرسوم</button>
</nav>

<script>
const $=id=>document.getElementById(id);
let db=JSON.parse(localStorage.getItem('snj')||'{"s":[],"t":[],"f":[]}');
function save(){localStorage.setItem('snj',JSON.stringify(db));render()}
function show(n,b){
  document.querySelectorAll('.sec').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('nav button').forEach(e=>e.classList.remove('on'));
  $(n).classList.add('on');b.classList.add('on');
}
function addS(){if(!$('sn').value.trim())return;db.s.push({n:$('sn').value,c:$('sc').value,p:0});$('sn').value='';$('sc').value='';save()}
function addT(){if(!$('tn').value.trim())return;db.t.push({n:$('tn').value,m:$('tm').value});$('tn').value='';$('tm').value='';save()}
function addF(){if(!$('fn').value.trim())return;db.f.push({n:$('fn').value,a:$('fa').value,p:0});$('fn').value='';$('fa').value='';save()}
function del(k,i){db[k].splice(i,1);save()}
function tg(k,i){db[k][i].p=db[k][i].p?0:1;save()}
function empty(){return '<div style="color:var(--mut)">لا توجد بيانات بعد</div>'}
function render(){
  const p=db.s.filter(x=>x.p).length;
  $('cs').textContent=db.s.length;
  $('ct').textContent=db.t.length;
  $('cp').textContent=p;
  $('cf').textContent=db.f.filter(x=>x.p).length;
  $('bar').style.width=(db.s.length?p/db.s.length*100:0)+'%';
  $('ls').innerHTML=db.s.map((x,i)=>`<div class="row"><span>${x.n} <small style="color:var(--mut)">${x.c}</small></span><button class="del" onclick="del('s',${i})">حذف</button></div>`).join('')||empty();
  $('lt').innerHTML=db.t.map((x,i)=>`<div class="row"><span>${x.n} <small style="color:var(--mut)">${x.m}</small></span><button class="del" onclick="del('t',${i})">حذف</button></div>`).join('')||empty();
  $('la').innerHTML=db.s.map((x,i)=>`<div class="row"><span>${x.n}</span><button class="${x.p?'ok':'no'}" onclick="tg('s',${i})">${x.p?'حاضر':'غائب'}</button></div>`).join('')||empty();
  $('lf').innerHTML=db.f.map((x,i)=>`<div class="row"><span>${x.n} <small style="color:var(--mut)">${x.a}</small></span><button class="${x.p?'ok':'no'}" onclick="tg('f',${i})">${x.p?'مدفوع':'غير مدفوع'}</button></div>`).join('')||empty();
}
render();
</script>
</body>
</html>
